<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12110f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f1ece2" media="(prefers-color-scheme: light)">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      // Home list view, set before paint so a saved grid view does not flash as a list.
      try { if (localStorage.getItem('home-view') === 'grid') document.documentElement.setAttribute('data-home-view', 'grid'); } catch (e) {}
    })();
    // Page-turn direction, set on <html> before first render (so not in deferred blog.js). The new page draws the
    // transition, so only pagereveal matters. A data attribute instead of view-transition types: Safari lacks the
    // Navigation API that told the old page where it was going, so going back played the forward turn there.
    (function () {
      var home = '{{ "/" | relative_url }}';
      window.addEventListener('pagereveal', function (e) {
        if (!e.viewTransition) return;
        var act = window.navigation && navigation.activation;
        var turn = location.pathname === home ? 'backward' : 'forward';
        if (act && act.navigationType === 'traverse' && act.from && act.entry) turn = act.entry.index < act.from.index ? 'backward' : 'forward';
        var root = document.documentElement;
        root.setAttribute('data-turn', turn);
        e.viewTransition.finished.finally(function () { root.removeAttribute('data-turn'); });
      });
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/reset.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/style.css" | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">
  <link href="{{ site.asset_url }}/favicon.ico" rel="shortcut icon" type="image/vnd.microsoft.icon">
  {% seo %}
  {% include analytics.html %}
  <script defer src="{{ "/assets/js/blog.js" | relative_url }}"></script>
</head>

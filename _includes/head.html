<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12110f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f1ece2" media="(prefers-color-scheme: light)">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      // Home list view, set before paint so a saved grid view does not flash as a list.
      try { if (localStorage.getItem('home-view') === 'grid') document.documentElement.setAttribute('data-home-view', 'grid'); } catch (e) {}
    })();
    // Page-turn direction for cross-document view transitions; must run before first render, so it cannot live in deferred blog.js.
    (function () {
      var home = '{{ "/" | relative_url }}';
      function turnType(act) {
        if (!act || !act.entry) return 'forward';
        if (act.navigationType === 'traverse' && act.from) return act.entry.index < act.from.index ? 'backward' : 'forward';
        return new URL(act.entry.url).pathname === home ? 'backward' : 'forward';
      }
      window.addEventListener('pageswap', function (e) {
        if (e.viewTransition) e.viewTransition.types.add(turnType(e.activation));
      });
      window.addEventListener('pagereveal', function (e) {
        if (e.viewTransition) e.viewTransition.types.add(turnType(window.navigation && navigation.activation));
      });
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/reset.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/style.css" | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">
  <link href="{{ site.asset_url }}/favicon.ico" rel="shortcut icon" type="image/vnd.microsoft.icon">
  {% seo %}
  <script defer src="{{ "/assets/js/blog.js" | relative_url }}"></script>
</head>
